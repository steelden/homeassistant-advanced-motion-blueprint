blueprint:
  name: "Motion-Activated Light (Multi-Sensor, Schedule)"
  description: >
    Turns devices on when ANY of the motion/occupancy sensors detects motion — but only
    while the schedule is on (or always, if no schedule is set). Turns them off when ALL
    sensors have been clear for the turn-off delay — at any time of day, schedule or not.

    Periods are set in a Schedule helper (Settings → Devices & services → Helpers →
    Create helper → Schedule): any number of periods, per weekday.
  domain: automation
  source_url: https://github.com/steelden/homeassistant-advanced-motion-blueprint/blob/main/advanced_motion_light_blueprint.yaml
  homeassistant:
    min_version: "2024.10.0"

  input:
    motion_sensors:
      name: "Motion sensors"
      description: >
        Motion is present while at least one sensor is on, and absent when none of them is
        (off or unavailable).
      selector:
        entity:
          domain: binary_sensor
          device_class:
            - motion
            - occupancy
          multiple: true

    targets:
      name: "Devices"
      description: "Lights, switches, fans, devices or areas to turn on and off."
      selector:
        target:

    schedule:
      name: "Schedule (optional)"
      description: >
        Motion turns the devices on only while this schedule is on. Leave empty to react to
        motion at any time. Turning off does not depend on the schedule.
      default: ""
      selector:
        entity:
          domain: schedule

    off_delay:
      name: "Turn-off delay"
      description: "How long all sensors must stay clear before the devices are turned off (0 = at once)."
      default: 0
      selector:
        number:
          min: 0
          max: 3600
          unit_of_measurement: seconds
          mode: box

mode: queued
max_exceeded: silent

trigger_variables:
  sensors: !input motion_sensors

variables:
  schedule: !input schedule

triggers:
  # Any sensor detects motion.
  - trigger: state
    entity_id: !input motion_sensors
    to: "on"
    id: motion
  # No sensor detects motion (all off or unavailable) — and it stayed so for the delay.
  - trigger: template
    value_template: "{{ expand(sensors) | selectattr('state', 'eq', 'on') | list | count == 0 }}"
    for:
      seconds: !input off_delay
    id: clear
  # After a restart, pending delays are lost; turn off if nobody is there.
  - trigger: homeassistant
    event: start
    id: start

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: motion
          - condition: template
            value_template: "{{ not schedule or is_state(schedule, 'on') }}"
        sequence:
          - action: homeassistant.turn_on
            target: !input targets
      - conditions:
          - condition: trigger
            id: clear
        sequence:
          - action: homeassistant.turn_off
            target: !input targets
      - conditions:
          - condition: trigger
            id: start
          - condition: template
            value_template: "{{ expand(sensors) | selectattr('state', 'eq', 'on') | list | count == 0 }}"
        sequence:
          - action: homeassistant.turn_off
            target: !input targets
